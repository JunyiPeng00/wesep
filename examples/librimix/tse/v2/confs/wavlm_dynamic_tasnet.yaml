dataloader_args:
  batch_size: 4
  drop_last: true
  num_workers: 6
  pin_memory: false
  prefetch_factor: 6

dataset_args:
  resample_rate: &sr 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  chunk_len: 48000
  speaker_feat: &speaker_feat false
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 1.0
  noise_lmdb_file: './data/musan/lmdb'
  noise_prob: 0
  specaug_enroll_prob: 0
  reverb_enroll_prob: 0
  noise_enroll_prob: 0

enable_amp: false
exp_dir: exp/WavLMDynamicTasNet
gpus: '0,1'
log_batch_interval: 100

loss: SISDR
loss_args: { }

model:
  tse_model: WavLMDynamicTasNet
model_args:
  tse_model:
    wavlm_name: wavlm_base
    wavlm_ckpt: /path/to/wavlm_base_plus.hf.pth
    wavlm_frozen: true

    encoder_dim: 512
    kernel_size: 320
    stride: 160

    sep_tcn_channels: 256
    post_fuse_tcn_X: 4
    post_fuse_tcn_R: 2
    num_hybrid_blocks: 5
    qkb_threshold: 0.5
    hybrid_mask_asymmetric: false
    spk_emb_dim: 256

    sample_rate: 16000
    silence_seconds: 1.0

    joint_training: true
    speaker_feat: false

model_init:
  tse_model: null

num_avg: 5
num_epochs: 150

optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001

clip_grad: 5.0
save_epoch_interval: 1

scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  tse_model:
    final_lr: 2.5e-05
    initial_lr: 0.001
    warm_from_zero: false
    warm_up_epoch: 0

seed: 42
